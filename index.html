<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChaosMusicGenerelTool(CMGT)</title>
    <style>
        body { background: #000; color: #0ff; font-family: 'Courier New', Courier, monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; touch-action: manipulation; }
        #panel { border: 3px double #0ff; padding: 20px; background: #001; width: 90%; max-width: 420px; box-shadow: 0 0 50px #f0f; text-align: center; }
        h1 { font-size: 0.9rem; margin-bottom: 15px; letter-spacing: 1px; color: #fff; text-shadow: 0 0 10px #0ff; }
        .stat { font-size: 1rem; margin: 10px 0; text-align: left; border-bottom: 1px solid #033; padding-bottom: 5px; word-break: break-all; min-height: 4em; overflow: hidden; }
        .highlight { color: #f0f; font-weight: bold; font-size: 1.3rem; }
        select { background: #000; color: #0ff; border: 1px solid #0ff; margin-bottom: 15px; font-size: 0.8rem; padding: 5px; width: 100%; cursor: pointer; }
        button { background: #0ff; color: #000; border: none; padding: 25px; width: 100%; font-size: 1.5rem; font-weight: bold; cursor: pointer; border-radius: 5px; transition: 0.05s; }
        button:active { filter: invert(1); transform: scale(1.05); }
        .msg { font-size: 0.7rem; color: #ff0; margin-top: 10px; font-weight: bold; animation: blink 0.1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body>
    <div id="panel">
        <select id="langSelector">
            <option value="ja">日本語 (JP)</option>
            <option value="en_us">English (US)</option>
            <option value="en_uk">English (UK)</option>
            <option value="en_au">English (AU)</option>
            <option value="hi">हिन्दी (IN)</option>
            <option value="zh_cn">简体中文 (CN)</option>
            <option value="zh_tw">繁體中文 (TW)</option>
        </select>
        <h1 id="ui_title">ULTRA CHAOS GENERATOR</h1>
        <div class="stat"><span id="ui_sounds">Simultaneous Sounds</span>: <span id="count" class="highlight">0</span></div>
        <div class="stat"><span id="ui_freq">Frequency Range</span>: <span id="freq">---</span></div>
        <div class="stat"><span id="ui_gap">Next Interval</span>: <span id="gap" class="highlight">---</span></div>
        <button id="btn">ACTIVATE CHAOS</button>
        <p id="ui_source" class="msg">SOURCE: RANDOM.ORG (TRUE ATMOSPHERIC)</p>
    </div>

<script>
    const i18n = {
        ja: { title: "大気同期カオス・ツール", sounds: "真の同時発音数", freq: "物理周波数(150桁)", gap: "大気由来の間隔", start: "大気カオス起動", stop: "大気停止", source: "ソース: RANDOM.ORG (大気ノイズ)" },
        en_us: { title: "ATMOSPHERIC CHAOS TOOL", sounds: "True Sounds Count", freq: "Physical Freq (150-Prec)", gap: "Atmospheric Gap", start: "ACTIVATE CHAOS", stop: "HALT CHAOS", source: "SOURCE: RANDOM.ORG (ATMOSPHERIC)" },
        en_uk: { title: "ATMOSPHERIC CHAOS TOOL", sounds: "True Sounds Count", freq: "Physical Freq (150-Prec)", gap: "Atmospheric Gap", start: "ACTIVATE CHAOS", stop: "HALT CHAOS", source: "SOURCE: RANDOM.ORG (ATMOSPHERIC)" },
        en_au: { title: "ATMOSPHERIC CHAOS TOOL", sounds: "True Sounds Count", freq: "Physical Freq (150-Prec)", gap: "Atmospheric Gap", start: "GO NUTS MATE", stop: "STOP IT MATE", source: "SOURCE: RANDOM.ORG (ATMOSPHERIC)" },
        hi: { title: "वायुमंडलीय अराजकता उपकरण", sounds: "सत्य ध्वनियाँ गिनती", freq: "शारीरिक आवृत्ति", gap: "वायुमंडलीय अंतराल", start: "सक्रिय करें", stop: "रोकें", source: "स्रोत: RANDOM.ORG" },
        zh_cn: { title: "大气混沌发生器", sounds: "真・同时发音数", freq: "物理频率 (150位)", gap: "大气源间隔", start: "启动混沌", stop: "停止混沌", source: "来源: RANDOM.ORG (大气噪声)" },
        zh_tw: { title: "大氣混沌發生器", sounds: "真・同時發音數", freq: "物理頻率 (150位)", gap: "大氣源間隔", start: "啟動混沌", stop: "停止混沌", source: "來源: RANDOM.ORG (大氣噪聲)" }
    };

    let audioCtx = null, isPlaying = false, timeoutId = null, entropyPool = [];
    const waves = ['sine', 'square', 'sawtooth', 'triangle'];
    const btn = document.getElementById('btn'), langSelector = document.getElementById('langSelector');

    function getHardwareEntropy() {
        const array = new Uint32Array(1);
        window.crypto.getRandomValues(array);
        return array[0] / 4294967296;
    }

    async function fetchEntropy() {
        try {
            const response = await fetch('https://api.random.org', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ jsonrpc: "2.0", method: "generateIntegers", params: { apiKey: "00000000-0000-0000-0000-000000000000", n: 100, min: 0, max: 1000000, replacement: true }, id: 1 })
            });
            const data = await response.json();
            if (data.result) entropyPool = data.result.random.data.map(n => n / 1000000);
        } catch (e) {
            for(let i=0; i<100; i++) entropyPool.push(getHardwareEntropy());
        } finally { updateUI(); }
    }

    function getTrueRandom() {
        if (entropyPool.length < 20) fetchEntropy();
        return (entropyPool.length > 0) ? entropyPool.shift() : getHardwareEntropy();
    }

    function getExtremeRandom(min, max) {
        let val = getTrueRandom() * (max - min) + min;
        let str = val.toString();
        if (!str.includes('.')) str += '.';
        while (str.length < 152) str += Math.floor(getTrueRandom() * 10).toString();
        return str.substring(0, 152);
    }

    function updateUI() {
        const l = i18n[langSelector.value];
        document.getElementById('ui_title').innerText = l.title;
        document.getElementById('ui_sounds').innerText = l.sounds;
        document.getElementById('ui_freq').innerText = l.freq;
        document.getElementById('ui_gap').innerText = l.gap;
        document.getElementById('ui_source').innerText = l.source;
        btn.innerText = isPlaying ? l.stop : l.start;
    }

    function triggerChaos() {
        if (!isPlaying) return;

        // 【いつ鳴らすか】大気ノイズから次の間隔を決定 (0.0s - 1.5s)
        const nextGapRaw = getExtremeRandom(0, 1.5);
        const nextGap = parseFloat(nextGapRaw);

        // 【個数】大気ノイズから決定 (1 - 10)
        const count = Math.floor(getTrueRandom() * 10) + 1;

        document.getElementById('count').innerText = count;
        document.getElementById('gap').innerText = nextGapRaw + "s";

        for (let i = 0; i < count; i++) {
            // 【周波数】大気ノイズから150桁精度
            const freqRaw = getExtremeRandom(20, 16000);
            const freqVal = parseFloat(freqRaw);
            
            // 【どこまで伸ばすか】大気ノイズから長さ決定 (0.05s - 3.0s)
            const durRaw = getExtremeRandom(0.05, 3.0);
            const dur = parseFloat(durRaw);

            const vol = parseFloat(getExtremeRandom(0, 1.0 / Math.sqrt(count)));
            const type = waves[Math.floor(getTrueRandom() * 4)];

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const panner = audioCtx.createStereoPanner();

            osc.type = type;
            osc.frequency.setValueAtTime(freqVal, audioCtx.currentTime);
            
            // 周波数のうねりも大気ノイズで変調
            osc.frequency.exponentialRampToValueAtTime(parseFloat(getExtremeRandom(20, 16000)), audioCtx.currentTime + dur);

            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);

            panner.pan.setValueAtTime(getTrueRandom() * 2 - 1, audioCtx.currentTime);

            osc.connect(gain).connect(panner).connect(audioCtx.destination);
            osc.start(); 
            osc.stop(audioCtx.currentTime + dur);

            if (i === 0) document.getElementById('freq').innerText = freqRaw + "Hz";
        }
        
        // 次のトリガー時間を「大気が決めた間隔」で予約
        timeoutId = setTimeout(triggerChaos, nextGap * 1000);
    }

    btn.addEventListener('click', function() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        isPlaying = !isPlaying;
        updateUI();
        if (isPlaying) { this.style.background = "#f0f"; triggerChaos(); }
        else { this.style.background = "#0ff"; clearTimeout(timeoutId); }
    });

    langSelector.addEventListener('change', updateUI);
    fetchEntropy();
</script>
</body>
</html>
