<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChaosMusicGeneralTool(CMGT) vULTIMATE - PURE PRNG</title>
    <style>
        body { background: #000; color: #0ff; font-family: 'Courier New', Courier, monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        #panel { border: 3px double #0ff; padding: 20px; background: #001; width: 100%; max-width: 600px; box-shadow: 0 0 50px #f0f; text-align: center; }
        h1 { font-size: 1.2rem; margin-bottom: 15px; letter-spacing: 1px; color: #fff; text-shadow: 0 0 10px #0ff; }
        .stat { font-size: 0.9rem; margin: 10px 0; text-align: left; border-bottom: 1px solid #033; padding-bottom: 5px; }
        #freq_list { font-size: 0.6rem; color: #0f0; text-align: left; max-height: 300px; overflow-y: auto; border: 1px solid #044; padding: 5px; background: #000; word-break: break-all; margin-top: 10px; }
        .freq-item { margin-bottom: 8px; border-left: 2px solid #f0f; padding-left: 5px; line-height: 1.2; }
        .highlight { color: #f0f; font-weight: bold; font-size: 1.2rem; }
        select { background: #000; color: #0ff; border: 1px solid #0ff; margin-bottom: 15px; font-size: 0.8rem; padding: 5px; width: 100%; cursor: pointer; }
        button { background: #0ff; color: #000; border: none; padding: 20px; width: 100%; font-size: 1.5rem; font-weight: bold; cursor: pointer; border-radius: 5px; transition: 0.05s; }
        button:active { filter: invert(1); transform: scale(1.02); }
        .msg { font-size: 0.7rem; color: #ff0; margin-top: 10px; font-weight: bold; animation: blink 0.1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body>
    <div id="panel">
        <select id="langSelector">
            <option value="ja">日本語 (JP)</option>
            <option value="en_us">English (US)</option>
            <option value="en_au">English (AU)</option>
        </select>
        <h1 id="ui_title">PURE CHAOS GENERATOR</h1>
        <div class="stat"><span id="ui_sounds">Simultaneous Sounds</span>: <span id="count" class="highlight">0</span></div>
        <div class="stat"><span id="ui_gap">Next Interval</span>: <span id="gap" class="highlight">---</span></div>
        <div id="freq_list"></div>
        <button id="btn">ACTIVATE CHAOS</button>
        <p id="ui_source" class="msg">SOURCE: INTERNAL PRNG (High-Precision)</p>
    </div>

<script>
    const i18n = {
        ja: { title: "高精度疑似乱数カオス・ツール", sounds: "同時発音数", gap: "次弾までの間隔", start: "カオス起動", stop: "カオス停止", source: "ソース: 高精度疑似乱数 (150桁)" },
        en_us: { title: "PURE CHAOS GENERATOR", sounds: "Active Oscillators", gap: "Chaos Interval", start: "ACTIVATE CHAOS", stop: "HALT CHAOS", source: "SOURCE: INTERNAL PRNG (150-Prec)" },
        en_au: { title: "PURE CHAOS GENERATOR", sounds: "Total Noise Units", gap: "Chaos Gap", start: "GO NUTS MATE", stop: "STOP IT MATE", source: "SOURCE: INTERNAL PRNG" }
    };

    let audioCtx = null, isPlaying = false, timeoutId = null;
    const waves = ['sine', 'square', 'sawtooth', 'triangle'];
    const btn = document.getElementById('btn'), 
          langSelector = document.getElementById('langSelector'),
          freqListDiv = document.getElementById('freq_list');

    function getTrueRandom() {
        const array = new Uint32Array(1);
        window.crypto.getRandomValues(array);
        return array[0] / 4294967296;
    }

    function getExtremeRandom(min, max) {
        let val = getTrueRandom() * (max - min) + min;
        let str = val.toString();
        if (!str.includes('.')) str += '.';
        while (str.length < 152) str += Math.floor(Math.random() * 10).toString();
        return str.substring(0, 152);
    }

    function updateUI() {
        const l = i18n[langSelector.value] || i18n.en_us;
        document.getElementById('ui_title').innerText = l.title;
        document.getElementById('ui_sounds').innerText = l.sounds;
        document.getElementById('ui_gap').innerText = l.gap;
        document.getElementById('ui_source').innerText = l.source;
        btn.innerText = isPlaying ? l.stop : l.start;
    }

    function triggerChaos() {
        if (!isPlaying) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const nextGapRaw = getExtremeRandom(0.01, 1.5);
        const count = Math.floor(getTrueRandom() * 10) + 1;

        document.getElementById('count').innerText = count;
        document.getElementById('gap').innerText = nextGapRaw + "s";
        
        // 周波数リストをクリア
        freqListDiv.innerHTML = '';

        for (let i = 0; i < count; i++) {
            const rawFreq = getExtremeRandom(20, 16000);
            const startFreq = parseFloat(rawFreq);
            const endFreq = parseFloat(getExtremeRandom(20, 16000));
            const dur = parseFloat(getExtremeRandom(0.1, 3.0));
            const type = waves[Math.floor(getTrueRandom() * 4)];

            // UIへの全表示
            const freqItem = document.createElement('div');
            freqItem.className = 'freq-item';
            freqItem.innerText = `OSC_${i+1}: ${rawFreq} Hz`;
            freqListDiv.appendChild(freqItem);

            const osc = audioCtx.createOscillator();
            const lfo = audioCtx.createOscillator();
            const lfoGain = audioCtx.createGain();
            const gain = audioCtx.createGain();

            osc.type = type;
            osc.frequency.setValueAtTime(startFreq, audioCtx.currentTime);

            const slideStartDelay = parseFloat(getExtremeRandom(0, dur * 0.4));
            const slideDuration = parseFloat(getExtremeRandom(0.01, dur - slideStartDelay));
            osc.frequency.exponentialRampToValueAtTime(endFreq, audioCtx.currentTime + slideStartDelay + slideDuration);

            const vibStart = parseFloat(getExtremeRandom(0, dur * 0.5));
            const vibFreq = parseFloat(getExtremeRandom(0.1, 30.0));
            const vibDepth = parseFloat(getExtremeRandom(0, 200.0));
            lfo.frequency.setValueAtTime(vibFreq, audioCtx.currentTime);
            lfoGain.gain.setValueAtTime(0, audioCtx.currentTime);
            lfoGain.gain.linearRampToValueAtTime(vibDepth, audioCtx.currentTime + vibStart + 0.1);
            
            lfo.connect(lfoGain);
            lfoGain.connect(osc.frequency);

            const kobushiTime = parseFloat(getExtremeRandom(dur * 0.7, dur * 0.95));
            const kobushiFreq = parseFloat(getExtremeRandom(20, 16000));
            osc.frequency.setValueAtTime(kobushiFreq, audioCtx.currentTime + kobushiTime);

            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.3 / Math.sqrt(count), audioCtx.currentTime + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);

            osc.connect(gain).connect(audioCtx.destination);
            lfo.start(audioCtx.currentTime + vibStart);
            osc.start();
            lfo.stop(audioCtx.currentTime + dur);
            osc.stop(audioCtx.currentTime + dur);
        }
        
        timeoutId = setTimeout(triggerChaos, parseFloat(nextGapRaw) * 1000);
    }

    btn.addEventListener('click', function() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        isPlaying = !isPlaying;
        updateUI();
        if (isPlaying) { 
            this.style.background = "#f0f"; 
            triggerChaos(); 
        } else { 
            this.style.background = "#0ff"; 
            clearTimeout(timeoutId); 
            freqListDiv.innerHTML = '';
        }
    });

    langSelector.addEventListener('change', updateUI);
    updateUI();
</script>
</body>
</html>
