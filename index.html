<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChaosMusicGenerelTool(CMGT)</title>
    <style>
        body { background: #000; color: #0ff; font-family: 'Courier New', Courier, monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; touch-action: manipulation; }
        #panel { border: 3px double #0ff; padding: 25px; background: #001; width: 85%; max-width: 400px; box-shadow: 0 0 30px #044; text-align: center; }
        h1 { font-size: 1rem; margin-bottom: 20px; letter-spacing: 2px; color: #fff; }
        .stat { font-size: 1.1rem; margin: 12px 0; text-align: left; border-bottom: 1px solid #033; padding-bottom: 5px; word-break: break-all; }
        .highlight { color: #f0f; font-weight: bold; font-size: 1.4rem; }
        button { background: #0ff; color: #000; border: none; padding: 25px; width: 100%; font-size: 1.4rem; font-weight: bold; cursor: pointer; border-radius: 5px; margin-top: 20px; transition: 0.1s; }
        button:disabled { background: #333; color: #666; cursor: wait; }
        .msg { font-size: 0.7rem; color: #ff0; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="panel">
        <h1>ATMOSPHERIC NOISE GENERATOR</h1>
        <div class="stat">Simultaneous Sounds: <span id="count" class="highlight">0</span></div>
        <div class="stat">Frequency Range: <span id="freq">---</span></div>
        <div class="stat">Next Interval: <span id="gap" class="highlight">---</span></div>
        
        <button id="btn">FETCHING ATMOSPHERE...</button>
        <p class="msg">SOURCE: RANDOM.ORG (True Atmospheric Noise)</p>
    </div>

<script>
    let audioCtx = null;
    let isPlaying = false;
    let timeoutId = null;
    const waves = ['sine', 'square', 'sawtooth', 'triangle'];
    let entropyPool = [];

    // 真の乱数を取得 (JSON-RPCを使用)
    async function fetchAtmosphericNoise() {
        try {
            // RANDOM.ORG公式のRPCエンドポイント
            const response = await fetch('https://api.random.org', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    jsonrpc: "2.0",
                    method: "generateIntegers",
                    params: {
                        apiKey: "00000000-0000-0000-0000-000000000000", // デモ用キー
                        n: 50, min: 0, max: 1000000, replacement: true
                    },
                    id: 1
                })
            });
            const data = await response.json();
            if (data.result) {
                entropyPool = data.result.random.data.map(n => n / 1000000);
            } else {
                throw new Error("Quota exceeded or error");
            }
        } catch (e) {
            // APIエラー時はOSの物理エントロピーを使用
            for(let i=0; i<50; i++) {
                entropyPool.push(window.crypto.getRandomValues(new Uint32Array(1))[0] / 4294967295);
            }
        } finally {
            document.getElementById('btn').disabled = false;
            if (!isPlaying) document.getElementById('btn').innerText = "ACTIVATE ATMOSPHERE";
        }
    }

    function getTrueRandom() {
        if (entropyPool.length < 5) fetchAtmosphericNoise();
        return entropyPool.shift() || (window.crypto.getRandomValues(new Uint32Array(1))[0] / 4294967295);
    }

    function getExtremeRandom(min, max) {
        let baseVal = getTrueRandom() * (max - min) + min;
        let str = baseVal.toString();
        if (!str.includes('.')) str += '.';
        while (str.length < 152) {
            str += Math.floor(getTrueRandom() * 10).toString();
        }
        return str.substring(0, 152);
    }

    function triggerChaos() {
        if (!isPlaying) return;

        // 個数は必ず整数
        const count = Math.floor(getTrueRandom() * 10) + 1;
        const nextGapFull = getExtremeRandom(0, 1.5);

        document.getElementById('count').innerText = count;
        document.getElementById('gap').innerText = nextGapFull + "s";

        for (let i = 0; i < count; i++) {
            const freqFull = getExtremeRandom(20, 16000);
            const volumeFull = getExtremeRandom(0, 1.0 / Math.sqrt(count)); 
            const durationFull = getExtremeRandom(0.05, 3.0);
            const type = waves[Math.floor(getTrueRandom() * waves.length)];

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = type;
            osc.frequency.setValueAtTime(parseFloat(freqFull), audioCtx.currentTime);

            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(parseFloat(volumeFull), audioCtx.currentTime + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + parseFloat(durationFull));

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + parseFloat(durationFull));

            if (i === 0) document.getElementById('freq').innerText = freqFull + "Hz";
        }

        timeoutId = setTimeout(triggerChaos, parseFloat(nextGapFull) * 1000);
    }

    const btn = document.getElementById('btn');
    fetchAtmosphericNoise();

    btn.addEventListener('click', function() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        
        isPlaying = !isPlaying;
        if (isPlaying) {
            this.innerText = "HALT ATMOSPHERE";
            this.style.background = "#f0f";
            triggerChaos();
        } else {
            this.innerText = "ACTIVATE ATMOSPHERE";
            this.style.background = "#0ff";
            clearTimeout(timeoutId);
            document.getElementById('count').innerText = "0";
        }
    });
</script>
</body>
</html>
